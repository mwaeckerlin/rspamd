# ClamAV integration. Reaches clamd over TCP in the sibling
# mwaeckerlin/clamav container. A virus hit sets the CLAM_VIRUS
# symbol; in permissive/reject mode init.cpp additionally injects
# `action = "reject";` so the mail is bounced with 5xx at SMTP time
# regardless of its spam score. In log mode the symbol is stamped
# but nothing is rejected.
#
# scan_mime_parts = false → the WHOLE raw message goes to clamd, which
# parses MIME itself («Mail files support»). With per-part scanning
# rspamd only hands attachment parts to the scanner, so a payload in
# an inline text/html body (EICAR-style droppers, scripts) would
# never be seen. Whole-message scanning catches both.

clamav {
    servers         = "${CLAMAV_HOST}:${CLAMAV_PORT}";
    type            = "clamav";
    symbol          = "CLAM_VIRUS";
    scan_mime_parts = false;
    message         = "message rejected: virus detected";
    ${RSPAMD_ANTIVIRUS_ACTION}
}
