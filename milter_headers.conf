# Rspamd milter_headers — controls which headers rspamd adds to
# mail as it passes through the milter. Applied via
# `local.d/milter_headers.conf`.
#
# Signature-safety rule (mailservice project rule
# `.claude/CLAUDE.md` «Design philosophy»): rspamd may ADD headers,
# but must never rewrite headers that are potentially covered by
# the sender's DKIM signature (Subject, From, To, Date, Message-ID,
# References, In-Reply-To, MIME-Version, Content-Type). Adding
# headers is always safe — DKIM only signs the set enumerated in
# `h=`, and the standard headers listed above are never named there
# for anything we could safely add.
#
# What we add (all `X-Spam-*` are guaranteed unsigned by anyone):
#   authentication-results   canonical A-R header (dkim, spf, dmarc, arc)
#   x-spam-status            "Yes, score=..." / "No, score=..."
#   x-spam-level             asterisks proportional to score, easy MUA sort
#   x-spam                   set only when the mail crossed the add-header
#                            threshold; used by dovecot's fileinto rule
#                            when SPAM_DELIVERY_MODE=folder
#
# What we don't touch:
#   subject                  rewriting it invalidates the sender's DKIM
#                            signature — forbidden by project design

extended_spam_headers = true;

# Add authentication-results (dkim/spf/dmarc/arc verdicts),
# x-spam-status (Yes/No + score), x-spam-level (asterisks) and the
# built-in `spam-header` routine — reconfigured below to stamp
# `X-Spam-Flag: YES` (instead of its default "Deliver-To: Junk") on
# any mail that crossed the add-header threshold. That is the exact
# header dovecot's sieve_before rule checks under
# SPAM_DELIVERY_MODE=folder.
use = [
    "authentication-results",
    "x-spam-status",
    "x-spam-level",
    "spam-header",
];

routines {
    spam-header {
        header = "X-Spam-Flag";
        value = "YES";
    }
}
