# Force-action rules injected by init.cpp according to DKIM_DMARC:
#
#   off / log    — empty (nothing forced; verdicts only stamped)
#   permissive   — bad or unknown-key DKIM signature → hard 5xx
#                  (`(R_DKIM_REJECT | R_DKIM_PERMERROR) & !DKIM_SIGNED`)
#   reject       — additionally: no valid signature at all → hard 5xx
#                  (`!R_DKIM_ALLOW & !DKIM_SIGNED`)
#
# DKIM_SIGNED excludes our own outbound mail: dkim_signing stamps it
# when it signs, i.e. for SASL-authenticated users, local clients and
# sign_networks members — those must never be bounced for not yet
# carrying a signature.
${RSPAMD_FORCE_ACTIONS}
