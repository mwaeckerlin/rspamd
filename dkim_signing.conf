# DKIM signing: one 2048-bit RSA key per domain in DOMAINS, auto-
# generated by init.cpp on first start (analogous to the legacy
# mwaeckerlin/opendkim init). The per-domain key files live under the
# `dkim-keys` volume — persist them, otherwise every restart requires
# a fresh DNS TXT record roll-out.
#
# `use_domain = "header_from"` means: pick the signing key by the
# `From:` header domain, so a multi-domain server signs each domain
# with its own key. Same behaviour as the retired OpenDKIM
# SigningTable + KeyTable pair.

enabled = true;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = true;
sign_headers = "from:subject:to:date:message-id:content-type:mime-version:reply-to";
try_fallback = false;
use_domain = "header_from";
use_esld = true;
check_pubkey = false;

# Who gets their outbound mail signed: SASL-authenticated users,
# clients inside local_addrs (see options.inc), plus any network in
# sign_networks (e2e uses this to sign the test-runner's submissions
# while still verifying its inbound role — the two are distinguished
# by the From: domain having a key in the signing table).
sign_local = true;
sign_authenticated = true;
sign_networks = [${RSPAMD_SIGN_NETWORKS}];

# Signing table + key table are re-generated at start-up by init.cpp
# from the DOMAINS env — one line per domain each (OpenDKIM format).
signing_table = "/var/lib/rspamd/dkim/signing_table";
key_table     = "/var/lib/rspamd/dkim/key_table";
