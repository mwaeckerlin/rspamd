# Rspamd action thresholds. Applied via `local.d/actions.conf` so they
# override the shipped defaults. Values are filled in from env at
# start-up by init.cpp; the numbers below are the fallback defaults
# when the env is unset.
#
# Rspamd default scoring anchors (for reference):
#   no action         < 5   — clean mail, delivered untouched
#   greylist          >= 5  — soft-doubtful, delay to let sender re-try
#   add header        >= 6  — X-Spam-Flag / X-Spam-Report headers added
#   reject            >= 15 — hard 5xx bounce
#
# We keep those defaults (reject at 15) because "lieber ein wenig zu
# hohen Reject-Score als eine legitime Mail bouncen" — the tail of
# false positives at score 10-14 is where legitimate mail with wonky
# signals sits, and we do not want to reject it.
#
# `rewrite subject` is intentionally NOT enabled here: prefixing the
# Subject with `[SPAM]` invalidates the sender's DKIM signature (the
# subject header is almost always covered by `h=`), so any downstream
# hop that verifies would see `dkim=fail`. Marking is done via
# additional headers only — see local.d/milter_headers.conf — which
# leaves every signed header untouched.

greylist       = ${RSPAMD_GREYLIST_SCORE};
"add header"   = ${RSPAMD_ADDHEADER_SCORE};
reject         = ${RSPAMD_REJECT_SCORE};
