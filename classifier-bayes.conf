# Bayes classifier — trained by IMAPSieve on Junk-folder moves in the
# sibling dovecot container (see mailservice's `dovecot/sieve/` after
# v3.0.0). Redis backend keeps the trained data across container
# restarts.
#
# NOTE: this file lands in local.d/classifier-bayes.conf, which rspamd
# includes INSIDE the shipped `classifier "bayes" { … }` block from
# statistic.conf — so the options here are written bare, without a
# classifier wrapper (wrapping again would nest the section and break
# config parsing). The BAYES_HAM/BAYES_SPAM statfiles come from the
# package defaults.

backend = "redis";
min_tokens = 11;
autolearn = false;
per_user = ${RSPAMD_BAYES_PER_USER};

# Rspamd default: `min_learns` messages of EACH class must have been
# trained before Bayes symbols contribute to the score. With ~10 users
# and normal mail volume, global (per_user = false) reaches min_learns
# in days; per-user would take months per user. Default: global.
# Override via RSPAMD_BAYES_PER_USER=true.
min_learns = 200;
