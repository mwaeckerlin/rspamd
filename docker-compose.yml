# Standalone smoke test — spin rspamd up on its own, no mailservice
# stack around it. Not for production use; see mwaeckerlin/mailservice
# for the intended context.

services:
  redis:
    image: mwaeckerlin/redis
    # or: image: redis:alpine

  rspamd:
    image: mwaeckerlin/rspamd
    build: .
    environment:
      DOMAINS:    "example.com"
      DKIM_DMARC: "log"
      REDIS_HOST: "redis"
    ports:
      # loopback only: the controller trusts private source IPs without
      # a password (secure_ip), and Docker's userland proxy rewrites
      # every external client to such an address — never expose these
      # beyond the machine running the smoke test
      - "127.0.0.1:11332:11332"   # milter — connect from a local postfix
      - "127.0.0.1:11334:11334"   # web UI + rspamc HTTP endpoint
    volumes:
      - dkim-keys:/var/lib/rspamd
    depends_on:
      - redis

volumes:
  dkim-keys:
