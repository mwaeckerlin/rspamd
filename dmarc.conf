# DMARC enforcement. `reject` = act on `p=reject` policies (5xx bounce
# at SMTP time); if false, opendmarc-style monitor-only. Toggled from
# the DKIM_DMARC env at start-up by init.cpp:
#
#   off        no DMARC lookup at all (module disabled)
#   log        lookup + stamp Authentication-Results, never reject
#   permissive act on p=reject (default for Marc's design)
#   reject     same as permissive on the DMARC side
#
# `p=quarantine` is intentionally NOT rewritten into a Junk folder by
# this stack — the mailservice design (README «Design philosophy:
# reliability over filtering») is accept-or-reject, never silently
# quarantine. `p=quarantine` therefore behaves the same as no policy
# on this side; Rspamd's own spam score still decides whether the
# mail is rejected at SMTP time.

enabled = ${RSPAMD_DMARC_ENABLED};
reject_message = "message rejected: sender's DMARC policy is p=reject and this mail does not pass DKIM or SPF alignment";
# Injected by init.cpp: in permissive/reject mode this becomes
#   actions = { reject = "reject"; }
# (the value is the rspamd ACTION taken when the sender's policy says
# reject); in log/off mode the block is empty — verdict symbols and
# the Authentication-Results stamp still happen, nothing is rejected.
${RSPAMD_DMARC_ACTIONS}
